<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>联系</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #f5f5f5; overflow: hidden; }
    #knocket-container { width: 100%; height: 100%; position: relative; }
    .loading-tip {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 14px; color: #999; text-align: center;
    }
  </style>
</head>
<body>
  <div id="knocket-container">
    <div class="loading-tip" id="loading-tip">正在加载...</div>
  </div>
  <script src="https://trtc.io/knocket-sdk/sdk.js?identifier=0ee9b993c7ff89bb61&v=1791511906929"></script>
  <script>
    setTimeout(function() {
      var tip = document.getElementById('loading-tip');
      if (tip) tip.style.display = 'none';
    }, 5000);
  </script>
</body>
</html>
